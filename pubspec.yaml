name: mindquest
description: Gamified learning platform — Duolingo for nonfiction books
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Navigation
  go_router: ^17.3.0

  # Backend
  supabase_flutter: ^2.15.0

  # Auth
  google_sign_in: ^7.2.0

  # Firebase
  firebase_core: ^3.14.0
  firebase_analytics: ^11.4.0
  firebase_crashlytics: ^4.3.0
  firebase_messaging: ^15.2.5

  # UI animations
  flutter_animate: ^4.5.2
  lottie: ^3.3.3
  confetti: ^0.8.0
  shimmer: ^3.0.0

  # Data models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # AI / networking
  http: ^1.2.2
  web_socket_channel: ^3.0.1

  # Charts
  fl_chart: ^1.2.0

  # Audio
  audioplayers: ^6.9.0

  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4

  # Images
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.14

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  equatable: ^2.0.7
  dartz: ^0.10.1

  # Haptics
  flutter_vibrate: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/audio/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
